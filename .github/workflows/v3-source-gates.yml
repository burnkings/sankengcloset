name: V3 Source Gates

# V3 全量审计修复后补充门禁：
# PR 修改 pages/components/theme/scripts 时，必须运行 v24（运行时契约）、
# v25（Android 静态）与 V3 源码门禁（components/v2 引用禁令 / 主题响应式 / pages.json 路由与图标）。
on:
  pull_request:
    paths:
      - 'pages/**'
      - 'components/**'
      - 'theme/**'
      - 'scripts/**'
      - 'stores/**'
      - 'services/**'
      - 'config/**'
      - 'pages.json'
      - 'manifest.json'
      - '.github/workflows/v3-source-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runtime contract (V2.4)
        run: node scripts/check-v24-remote-runtime.js
      - name: Android static (V2.5)
        run: node scripts/check-v25-android-beta.js
      - name: V3 source gates (v2 refs / theme reactivity / pages.json)
        run: node scripts/check-source-gates.js
