name: V3 Source Gates

# 单一入口：`npm run verify`（scripts/verify.js）依次跑
#   源码门禁（v2 引用禁令 / 主题响应式 / pages.json 路由与图标 / uvue 绑定规则 / 提示宿主）
#   + 运行时契约（V2.4）+ 同步一致性（R0）+ Android 静态（V2.5）+ 单元测试（tests/*.test.cjs 自动发现）
# 日常迭代本地请用 `npm run verify:watch`：保存即自动校验，不需要手敲命令。
# 发布前用 `npm run check`：额外校验 mp-weixin 编译产物。
on:
  pull_request:
    paths:
      - 'pages/**'
      - 'components/**'
      - 'theme/**'
      - 'scripts/**'
      - 'stores/**'
      - 'services/**'
      - 'config/**'
      - 'pages.json'
      - 'manifest.json'
      - '.github/workflows/v3-source-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source verify (gates + runtime + sync + android + unit tests)
        run: npm run verify
